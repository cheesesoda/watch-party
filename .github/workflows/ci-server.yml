name: Server and web

on:
  pull_request:
    paths-ignore:
      - "android/**"
      - "**.md"
  workflow_dispatch:

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Proxy tests (app.tv.chzsda.com)
        run: node --test
        working-directory: proxy
      - run: npm run build
      # Same job as the tests, so the image check doesn't cost its own rounded-up minute.
      - run: docker build -t watch-party .
      - name: Smoke test the image
        run: |
          mkdir -p media
          docker run -d --name wp -p 8080:8080 -e WATCH_PASSWORD=ci -v "$PWD/media:/media:ro" watch-party
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          docker logs wp
