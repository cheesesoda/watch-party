name: Android release

# Builds a signed app bundle (.aab) for Google Play and, when the PLAY_SERVICE_ACCOUNT_JSON
# secret is set, publishes it to the internal testing track. Runs on every push to main that
# changes the app, or from the Actions tab.
# Needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD repository secrets (see docs/play-release.md).
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/release-android.yml"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 0.2.0 (leave empty for 0.2.<run number>)"
        required: false
      version_code:
        description: "Play version code (leave empty to use this workflow's run number)"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      VERSION_NAME: ${{ inputs.version_name || format('0.2.{0}', github.run_number) }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # "What's new" in Play: the titles of the PRs that changed the app since the last build that
      # reached Play. A merge whose own build was cancelled still gets listed in the next one.
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          prev=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-android.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          notes=""
          if [ -n "$prev" ] && git cat-file -e "$prev" 2>/dev/null; then
            notes=$(git log --first-parent --merges --format='%b' "$prev..HEAD" -- . | sed '/^$/d' | head -n 12 | sed 's/^/- /')
          fi
          [ -n "$notes" ] || notes="- Fixes and improvements"
          printf '%s\n' "$notes" | cut -c1-120 | head -c 500 > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          echo "Release notes:"; cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          echo "WHATSNEW_DIR=$RUNNER_TEMP/whatsnew" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: ./gradlew --no-daemon bundleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: watch-party-${{ env.VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
      # Testers get it as an update from the Play Store. Skipped until the secret is set.
      - name: Publish to internal testing
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cheeseparty.app
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          releaseName: ${{ env.VERSION_NAME }}
          track: internal
          status: completed
          whatsNewDirectory: ${{ env.WHATSNEW_DIR }}
