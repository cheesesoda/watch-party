name: Android release

# Builds a signed app bundle (.aab) for Google Play. Run it from the Actions tab.
# Needs the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD repository secrets (see docs/play-release.md).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown to users, e.g. 0.2.0"
        required: true
      version_code:
        description: "Play version code (leave empty to use this workflow's run number)"
        required: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: ./gradlew --no-daemon bundleRelease -PversionName="$VERSION_NAME" -PversionCode="$VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: watch-party-${{ inputs.version_name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
