name: Android

on:
  pull_request:
    paths:
      - "android/**"
  # Run from the Actions tab to build an APK from any branch.
  workflow_dispatch:
    inputs:
      screens:
        description: Push the TV screen tests' pictures to the ci-screens branch
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Compile errors also become annotations, so they show on the PR without opening the log.
      - run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log || {
            # One annotation holding them all: a step shows at most 10.
            errors=$(grep -E '^e: ' build.log | head -60 | sed -E 's#^e: file://[^ ]*/app/src/main/java/com/watchparty/app/##' | awk '{printf "%s%%0A", $0}')
            [ -n "$errors" ] && echo "::error title=Compile errors::$errors"
            exit 1
          }
      # Failed tests become annotations too.
      - name: Report failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          lines = []
          for f in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for fail in case.findall("failure") + case.findall("error"):
                      msg = (fail.get("message") or fail.text or "").strip().splitlines()[:3]
                      lines.append(f"{case.get('classname').split('.')[-1]}.{case.get('name')}: {' | '.join(msg)}"[:400])
          if lines:
              print("::error title=Failed tests::" + "%0A".join(lines[:20]))
          PY
      # Run by hand with "screens" ticked, the TV screen tests' pictures go to the ci-screens branch, so they can be
      # looked at from anywhere GitHub's code is reachable (artifact downloads aren't always).
      - name: Publish TV screenshots
        if: always() && github.event_name == 'workflow_dispatch' && inputs.screens
        working-directory: android/app/build/tv-screens
        run: |
          git init -q && git checkout -q -b ci-screens
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "TV screens from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
      # Android TV has no camera or touchscreen: a library that marks either as required would hide
      # the app from TVs on Play. Lists the merged manifest's features and fails if any is required.
      - name: Check the app still installs on TVs
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          A = "{http://schemas.android.com/apk/res/android}"
          path = glob.glob("app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml", recursive=True)[0]
          bad = []
          root = ET.parse(path).getroot()
          for p in root.iter("uses-permission"):
              print(f"uses-permission {p.get(A + 'name')}")
          # Play treats these permissions as requiring hardware unless a uses-feature says otherwise.
          implied = {"android.permission.CAMERA": "android.hardware.camera", "android.permission.RECORD_AUDIO": "android.hardware.microphone",
                     "android.permission.ACCESS_FINE_LOCATION": "android.hardware.location.gps", "android.permission.BLUETOOTH": "android.hardware.bluetooth"}
          declared = {f.get(A + "name") for f in root.iter("uses-feature")}
          for p in root.iter("uses-permission"):
              feature = implied.get(p.get(A + "name"))
              if feature and feature not in declared and not any(d and d.startswith(feature + ".") for d in declared):
                  bad.append(f"{feature} (implied by {p.get(A + 'name')})")
          for f in root.iter("uses-feature"):
              name, required = f.get(A + "name"), f.get(A + "required", "true")
              print(f"uses-feature {name} required={required}")
              if required == "true" and name and name != "android.software.leanback" and f.get(A + "glEsVersion") is None:
                  bad.append(name)
          # An activity locked to one orientation makes Play require that screen orientation, unless a uses-feature
          # says it's optional. Google's code scanner locks itself to portrait, which hid the app from TVs.
          orientation = {"portrait": "android.hardware.screen.portrait", "reversePortrait": "android.hardware.screen.portrait",
                         "sensorPortrait": "android.hardware.screen.portrait", "userPortrait": "android.hardware.screen.portrait",
                         "landscape": "android.hardware.screen.landscape", "reverseLandscape": "android.hardware.screen.landscape",
                         "sensorLandscape": "android.hardware.screen.landscape", "userLandscape": "android.hardware.screen.landscape"}
          for a in root.iter("activity"):
              value = a.get(A + "screenOrientation")
              if value:
                  print(f"activity {a.get(A + 'name')} screenOrientation={value}")
              feature = orientation.get(value)
              if feature and feature not in declared and feature not in bad:
                  bad.append(f"{feature} (implied by {a.get(A + 'name')})")
          if bad:
              print(f"::error::These features are required, so Play would hide the app from TVs: {', '.join(bad)}")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watch-party-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
