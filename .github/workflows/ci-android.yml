name: Android

on:
  pull_request:
    paths:
      - "android/**"
  # Run from the Actions tab to build an APK from any branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      # Android TV has no camera or touchscreen: a library that marks either as required would hide
      # the app from TVs on Play. Lists the merged manifest's features and fails if any is required.
      - name: Check the app still installs on TVs
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          A = "{http://schemas.android.com/apk/res/android}"
          path = glob.glob("app/build/intermediates/merged_manifests/release/**/AndroidManifest.xml", recursive=True)[0]
          bad = []
          root = ET.parse(path).getroot()
          for p in root.iter("uses-permission"):
              print(f"uses-permission {p.get(A + 'name')}")
          # Play treats these permissions as requiring hardware unless a uses-feature says otherwise.
          implied = {"android.permission.CAMERA": "android.hardware.camera", "android.permission.RECORD_AUDIO": "android.hardware.microphone",
                     "android.permission.ACCESS_FINE_LOCATION": "android.hardware.location.gps", "android.permission.BLUETOOTH": "android.hardware.bluetooth"}
          declared = {f.get(A + "name") for f in root.iter("uses-feature")}
          for p in root.iter("uses-permission"):
              feature = implied.get(p.get(A + "name"))
              if feature and feature not in declared and not any(d and d.startswith(feature + ".") for d in declared):
                  bad.append(f"{feature} (implied by {p.get(A + 'name')})")
          for f in root.iter("uses-feature"):
              name, required = f.get(A + "name"), f.get(A + "required", "true")
              print(f"uses-feature {name} required={required}")
              if required == "true" and name and name != "android.software.leanback" and f.get(A + "glEsVersion") is None:
                  bad.append(name)
          for a in root.iter("activity"):
              if a.get(A + "screenOrientation"):
                  print(f"activity {a.get(A + 'name')} screenOrientation={a.get(A + 'screenOrientation')}")
          # Play filters on what aapt reports, which includes features implied by orientation locks and permissions.
          import os, re, subprocess
          sdk = os.environ.get("ANDROID_HOME") or os.environ["ANDROID_SDK_ROOT"]
          aapt2 = sorted(glob.glob(f"{sdk}/build-tools/*/aapt2"))[-1]
          apk = glob.glob("app/build/outputs/apk/release/*.apk")[0]
          badging = subprocess.run([aapt2, "dump", "badging", apk], capture_output=True, text=True, check=True).stdout
          allowed = {"android.hardware.faketouch", "android.hardware.screen.landscape"}
          for line in badging.splitlines():
              if line.startswith(("uses-feature", "uses-implied-feature")):
                  print(line)
              m = re.match(r"uses-feature: name='([^']+)'", line)
              if m and m.group(1) not in allowed and m.group(1) not in bad:
                  bad.append(m.group(1))
          if bad:
              print(f"::error::These features are required, so Play would hide the app from TVs: {', '.join(bad)}")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: watch-party-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
