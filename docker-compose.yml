services:
  watch-party:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WATCH_PASSWORD: ${WATCH_PASSWORD:?Set WATCH_PASSWORD in .env}
      # Optional STUN/TURN servers for voice chat (JSON); empty uses Google's public STUN.
      ICE_SERVERS: ${ICE_SERVERS:-}
      # Proxies whose X-Forwarded-For is trusted for the login rate limit. A proxy on the host
      # (like `tailscale serve`) reaches the container from Docker's network, not localhost.
      TRUST_PROXY: ${TRUST_PROXY:-loopback, 172.16.0.0/12}
    volumes:
      # Point this at your movie folder. Read-only is enough.
      - ${MEDIA_PATH:-./media}:/media:ro
